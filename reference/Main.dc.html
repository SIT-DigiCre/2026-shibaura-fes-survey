<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A ライトグリッド</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
body{margin:0}
a{color:#0077AA}a:hover{color:#123247}
</style>
</helmet>
<div style="width: 540px; height: 1920px; box-sizing: border-box; background-color: #FFFFFF; background-image: radial-gradient(#CDEEFB 1.3px, transparent 1.7px); background-size: 20px 20px; display: flex; flex-direction: column; font-family: 'Noto Sans JP', sans-serif; color: #123247; overflow: hidden">

  <div style="height: 190px; flex-shrink: 0; background: #00B0F0; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; box-sizing: border-box">
    <img src="/_blob/97baae753832a43672d7fb9fef4a1cb6" alt="デジクリ Digital Creation Circle" style="width: 290px; height: 83px; display: block">
    <div style="background: #FFFFFF; color: #123247; padding: 14px 16px; width: 156px; box-sizing: border-box; box-shadow: 5px 5px 0 #0077AA">
      <div style="font-family: 'Silkscreen', monospace; font-size: 13px; letter-spacing: 2px; color: #0077AA">PRESENT</div>
      <div style="font-weight: 900; font-size: 19px; line-height: 25px; margin-top: 4px">回答で<br>イラストカード</div>
    </div>
  </div>

  <div style="height: 54px; flex-shrink: 0; background: #FFFFFF; border-bottom: 3px solid #00B0F0; display: flex; align-items: center; justify-content: space-between; padding: 0 28px">
    <div style="font-family: 'DotGothic16', sans-serif; font-size: 19px">芝浦祭 2026 ／ ブース評価アンケート</div>
    <div style="font-size: 16px; color: #4A6577">回答 <span style="font-family: 'Silkscreen', monospace; color: #0077AA; font-size: 18px">[N]</span> 件</div>
  </div>

  <div style="height: 76px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 28px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
      <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-size: 15px; background: {{s.bg}}; color: {{s.fg}}; border: 2px solid {{s.border}}; box-sizing: border-box">{{s.label}}</div>
    </sc-for>
  </div>

  <div style="height: 880px; flex-shrink: 0; margin: 0 28px; background: #FFFFFF; border: 2px solid #00B0F0; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 8px 8px 0 #E1F4FC">
    <div style="height: 10px; background: #00B0F0; flex-shrink: 0"></div>
    <div style="padding: 22px 24px 0; flex: 1; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 54px; line-height: 54px; color: #0077AA; text-shadow: 4px 4px 0 #BFE9FA">Q1</div>
        <div style="font-family: 'Silkscreen', monospace; font-size: 14px; letter-spacing: 2px; color: #0077AA; border: 2px solid #00B0F0; padding: 3px 8px">MULTI</div>
      </div>
      <h1 style="margin: 16px 0 0; font-weight: 900; font-size: 33px; line-height: 42px">良いと思った展示・体験は？</h1>
      <p style="margin: 8px 0 18px; font-size: 18px; line-height: 27px; color: #4A6577">いくつでも選べます。特に良かったものは<br><b style="color: #0077AA">長押し</b> か <b style="color: #0077AA">2回タップ</b> で ★BEST に</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 36px">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="11">
          <button style="height: 74px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 21px; text-align: left; box-shadow: {{o.shadow}}; cursor: pointer">
            <span style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-size: 16px; background: {{o.kbg}}; color: {{o.kfg}}">{{o.key}}</span>
            <span style="flex: 1">{{o.label}}</span>
            <sc-if value="{{o.best}}" hint-placeholder-val="{{false}}">
              <span style="font-family: 'Silkscreen', monospace; font-size: 11px; background: #FFFFFF; color: #0077AA; padding: 3px 5px">★BEST</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <div style="margin-top: auto; padding: 24px 0 22px; border-top: 2px dashed #9FDCF5; display: flex; justify-content: space-between; gap: 14px">
        <button style="width: 150px; height: 76px; border: 2px solid #0077AA; background: #FFFFFF; color: #0077AA; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 22px; cursor: pointer">◀ もどる</button>
        <button style="flex: 1; height: 76px; border: 2px solid #0077AA; background: #0077AA; color: #FFFFFF; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 24px; box-shadow: 6px 6px 0 #00B0F0; cursor: pointer">つぎへ ▶</button>
      </div>
    </div>
  </div>

  <div style="flex: 1; margin: 22px 28px 0; background: #EFFAFE; border: 2px solid #00B0F0; border-bottom: 0; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 2px dashed #8ED7F5">
      <div style="font-family: 'Silkscreen', monospace; font-size: 16px; letter-spacing: 2px; color: #0077AA">YOUR ANSWERS</div>
      <div style="font-size: 16px; color: #4A6577">タッチで修正できます</div>
    </div>
    <div style="flex: 1; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; gap: 8px; padding: 14px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <div style="padding: 10px 14px; font-weight: 700; font-size: 18px; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}; box-shadow: {{c.shadow}}; transform: rotate({{c.rot}}deg)"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; margin-right: 8px; opacity: .8">{{c.q}}</span>{{c.label}}</div>
      </sc-for>
    </div>
    <div style="height: 12px; background: #00B0F0"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    var DEEP = '#0077AA', INK = '#123247', CYAN = '#00B0F0';
    var genres = [['A','イラスト','on'],['B','MV',''],['C','ゲーム展示','best'],['D','VTuber','on'],['E','DTM体験',''],['F','楽曲・映像視聴',''],['G','文字書き',''],['H','物販',''],['I','ライブ創作',''],['J','企画うちよそ',''],['K','その他','']];
    var opts = genres.map(function (g) {
      var on = g[2] === 'on', best = g[2] === 'best', sel = on || best;
      return {
        key: g[0], label: g[1], best: best,
        bg: sel ? DEEP : '#FFFFFF', fg: sel ? '#FFFFFF' : INK, border: sel ? DEEP : '#9FDCF5',
        kbg: sel ? '#FFFFFF' : '#E1F4FC', kfg: DEEP,
        shadow: best ? 'inset 8px 0 0 ' + CYAN : 'none'
      };
    });
    var steps = [1,2,3,4,5,6,7].map(function (n) {
      var cur = n === 1;
      return { label: 'Q' + n, bg: cur ? DEEP : '#FFFFFF', fg: cur ? '#FFFFFF' : '#4A6577', border: cur ? DEEP : '#9FDCF5' };
    });
    var chips = [
      { q: 'Q1', label: 'A イラスト', bg: DEEP, fg: '#FFFFFF', border: DEEP, shadow: 'none', rot: -2 },
      { q: 'Q1', label: 'C ゲーム展示 ★BEST', bg: DEEP, fg: '#FFFFFF', border: DEEP, shadow: 'inset 6px 0 0 ' + CYAN, rot: 1.5 },
      { q: 'Q1', label: 'D VTuber', bg: DEEP, fg: '#FFFFFF', border: DEEP, shadow: 'none', rot: -1 }
    ];
    return { opts: opts, steps: steps, chips: chips };
  }
}
</script>
</body>
</html>
