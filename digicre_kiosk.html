<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>デジクリ評価アンケート 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
<!--
  芝浦祭 2026 デジクリ評価アンケート（超縦長タッチサイネージ版）
  対象: LG in-TOUCH Stretch 29" 縦置き 540x1920 / Android 7.1（Chromium 53〜58 相当）

  設計メモ
  - 画面は 540x1920 の固定 px で組み、JS で transform: scale() して実画面にフィットさせる
    → 使う単位は px / % / vw / vh / calc() のみ。clamp()・grid・gap・svh 等は不使用
  - JS は ES5 のみ（アロー関数・let/const・テンプレート文字列なし）
  - clip-path は -webkit- 付きも併記（Chromium 53/54 対策）
  - Excel 出力は SheetJS。同じフォルダの xlsx.full.min.js を先に探し、なければ CDN を読む
  - Google Fonts は media="print" → onload で有効化（回線が悪くても初回描画を止めない）
  - 管理: 上部のロゴを 5 回連続タップ → PIN（CFG.PIN）
-->
<style>
/* レイアウト: 540x1920 の柱。上 = ロゴ / 進捗 / 設問パネル（目線の高さ。送信もここ）、下 = 回答チップが落ちて溜まる STOCK（見るだけ） */
:root{
  --cyan:#00B0F0;
  --cyan-60:rgba(0,176,240,.6);
  --cyan-35:rgba(0,176,240,.35);
  --cyan-12:rgba(0,176,240,.12);
  --black:#000000;
  --bg:#05080c;
  --surface:#0e141b;
  --text:#FFFFFF;
  --sub:#8fa3b0;
  --f-pixel:"DotGothic16","Noto Sans JP","Noto Sans CJK JP",monospace;
  --f-hud:"Silkscreen","DotGothic16",monospace;
  --f-body:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;background:var(--black);color:#fff;color:var(--text);
  font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-text-size-adjust:100%}
#vp{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:#00B0F0}

#app{position:absolute;left:0;top:0;width:540px;height:1920px;overflow:hidden;background:#00B0F0;background-color:var(--cyan);
  -webkit-transform-origin:0 0;transform-origin:0 0;
  background-image:radial-gradient(rgba(0,40,80,.22) 1px,rgba(0,40,80,0) 1.6px);background-size:12px 12px;background-position:6px 6px}
#app:before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
  background-image:linear-gradient(to right,rgba(255,255,255,.16) 1px,rgba(255,255,255,0) 1px),linear-gradient(to bottom,rgba(255,255,255,.16) 1px,rgba(255,255,255,0) 1px);
  background-size:60px 60px}
#app:after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 1px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px)}

/* 面取り（45度カット） */
.cut{-webkit-clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
             clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.cut .in{-webkit-clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
                 clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.cutL{-webkit-clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px);
              clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px)}
.cutL .in{-webkit-clip-path:polygon(23px 0,100% 0,100% calc(100% - 23px),calc(100% - 23px) 100%,0 100%,0 23px);
                  clip-path:polygon(23px 0,100% 0,100% calc(100% - 23px),calc(100% - 23px) 100%,0 100%,0 23px)}
.in{position:absolute;left:1px;top:1px;right:1px;bottom:1px}

/* ---------- ヘッダー（ロゴ） ---------- */
#logo{position:absolute;left:24px;top:28px;width:492px;height:132px}
.lm{position:absolute;left:0;top:0}
@-webkit-keyframes gl1{0%,88%,100%{-webkit-clip-path:inset(0 0 100% 0);opacity:0}89%{-webkit-clip-path:inset(20% 0 55% 0);opacity:1;-webkit-transform:translateX(-4px)}92%{-webkit-clip-path:inset(60% 0 10% 0);opacity:1;-webkit-transform:translateX(5px)}95%{opacity:0}}
@keyframes gl1{0%,88%,100%{clip-path:inset(0 0 100% 0);-webkit-clip-path:inset(0 0 100% 0);opacity:0}89%{clip-path:inset(20% 0 55% 0);-webkit-clip-path:inset(20% 0 55% 0);opacity:1;transform:translateX(-4px)}92%{clip-path:inset(60% 0 10% 0);-webkit-clip-path:inset(60% 0 10% 0);opacity:1;transform:translateX(5px)}95%{opacity:0}}
@-webkit-keyframes gl2{0%,90%,100%{opacity:0}91%{opacity:.9;-webkit-transform:translate(3px,-2px)}94%{opacity:.9;-webkit-transform:translate(-6px,1px)}96%{opacity:0}}
@keyframes gl2{0%,90%,100%{opacity:0}91%{opacity:.9;transform:translate(3px,-2px)}94%{opacity:.9;transform:translate(-6px,1px)}96%{opacity:0}}

.gift{position:absolute;right:0;top:4px;width:178px;height:92px;background:#05080c}
.gift .in{background:#05080c;color:#fff;padding:9px 12px 0 18px}
.gift-k{font-family:var(--f-hud);font-size:16px;line-height:18px;letter-spacing:1px;color:#00B0F0}
.gift-t{font-family:var(--f-body);font-weight:900;font-size:19px;line-height:24px;margin-top:3px}

/* ---------- 進捗 HUD ---------- */
#prog{position:absolute;left:24px;top:162px;width:492px;height:56px;background:#05080c}
#qcode{position:absolute;left:14px;top:9px;font-family:var(--f-hud);font-size:20px;line-height:20px;color:var(--cyan);letter-spacing:2px}
#total{position:absolute;right:14px;top:8px;font-family:var(--f-pixel);font-size:18px;line-height:22px;color:#fff}
#total b{font-family:var(--f-hud);color:var(--cyan);font-size:18px;margin:0 3px;font-weight:400}
#segs{position:absolute;left:14px;top:38px;width:464px;height:8px;font-size:0;white-space:nowrap}
#segs i{display:inline-block;width:60px;height:8px;margin-right:7px;background:rgba(255,255,255,.14);
  -webkit-transform:skewX(-30deg);transform:skewX(-30deg);-webkit-transition:background-color .2s;transition:background-color .2s}
#segs i:last-child{margin-right:0}
#segs i.ok{background:var(--cyan)}
#segs i.cur{background:#fff}

/* ---------- 設問パネル ---------- */
#qpanel{position:absolute;left:24px;top:228px;width:492px;height:800px;background:#fff}
#qpanel>.in{background:#0e141b;background:var(--surface)}
.brk{position:absolute;width:22px;height:22px;border-color:var(--cyan);border-style:solid;pointer-events:none}
.brk.tl{left:30px;top:10px;border-width:2px 0 0 2px}
.brk.br{right:30px;bottom:10px;border-width:0 2px 2px 0}
#qbody{position:absolute;left:22px;top:22px;width:446px;height:660px}
#qbody.enter{-webkit-animation:qin .28s ease-out;animation:qin .28s ease-out}
@-webkit-keyframes qin{0%{opacity:0;-webkit-transform:translateX(24px)}60%{opacity:1}100%{-webkit-transform:none}}
@keyframes qin{0%{opacity:0;transform:translateX(24px)}60%{opacity:1}100%{transform:none}}
.qh{position:relative;height:56px}
.qn{position:absolute;left:0;top:0;font-family:var(--f-hud);font-weight:700;font-size:50px;line-height:50px;color:var(--cyan)}
.qtype{position:absolute;left:96px;top:6px;font-family:var(--f-hud);font-size:16px;letter-spacing:2px;color:var(--cyan);background:transparent;border:1px solid var(--cyan);padding:2px 8px}
.qtype.opt{background:transparent;color:var(--sub);border:1px solid var(--sub)}
.qt{font-family:var(--f-body);font-weight:900;font-size:33px;line-height:42px;margin-top:4px;height:84px;letter-spacing:.5px}
.qhint{font-family:var(--f-pixel);font-size:19px;line-height:26px;color:var(--sub);height:54px;margin-top:0}
.qhint em{font-style:normal;color:var(--cyan)}
.opts{margin-top:6px;font-size:0}
.o{position:relative;display:inline-block;vertical-align:top;width:217px;height:72px;margin:0 12px 12px 0;
  background:rgba(0,176,240,.5);-webkit-transition:-webkit-transform .06s;transition:transform .06s}
.o:nth-child(2n){margin-right:0}
.one .o{width:446px;height:66px;margin-right:0;margin-bottom:10px}
.tall .o{height:64px;margin-bottom:10px}
.o .in{background:var(--surface);display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;padding:0 10px 0 14px}
.o .key{-webkit-flex:0 0 auto;flex:0 0 auto;width:30px;height:30px;line-height:30px;text-align:center;font-family:var(--f-hud);font-size:16px;
  background:var(--cyan-12);color:var(--cyan);margin-right:10px}
.o .lb{-webkit-flex:1 1 auto;flex:1 1 auto;font-family:var(--f-body);font-weight:700;font-size:21px;line-height:25px;color:var(--sub)}
.o .lb.s{font-size:17px;line-height:21px}
.o .lv{-webkit-flex:0 0 auto;flex:0 0 auto;font-size:0;margin-left:8px}
.o .lv i{display:inline-block;width:10px;height:18px;margin-left:3px;background:var(--cyan-12)}
.o .lv i.f{background:var(--cyan)}
.o .bt{display:none;-webkit-flex:0 0 auto;flex:0 0 auto;font-family:var(--f-pixel);font-size:16px;line-height:20px;background:#000;color:#fff;padding:2px 5px;margin-left:2px}
/* 押した瞬間：縮小＋ボーダー反転 */
.o.pressing,.o:active{-webkit-transform:scale(.94);transform:scale(.94);background:#fff}
.o.pressing .in,.o:active .in{background:#16212c}
/* 選択中 */
.o.on{background:var(--cyan)}
.o.on .in{background:#fff}
.o.on .lb{color:#05080c}
.o.on .key{background:#000;color:var(--cyan)}
.o.on .lv i{background:rgba(0,0,0,.12)}
.o.on .lv i.f{background:var(--cyan)}
/* BEST */
.o.best{background:var(--cyan)}
.o.best .in{box-shadow:inset 8px 0 0 #00B0F0}
.o.best .in{background:#fff;background-image:linear-gradient(110deg,rgba(0,176,240,0) 40%,rgba(0,176,240,.45) 50%,rgba(0,176,240,0) 60%);
  background-size:300% 100%;-webkit-animation:sweep 1.6s linear infinite;animation:sweep 1.6s linear infinite}
.o.best .bt{display:block}
.o.best .lb{color:#05080c}
.o.best .key{background:#000;color:#fff}
@-webkit-keyframes sweep{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes sweep{0%{background-position:100% 0}100%{background-position:-100% 0}}

textarea.cm{display:block;width:446px;height:120px;margin-top:4px;border:1px solid var(--cyan-60);border-radius:0;background:#05080c;color:#fff;
  font-family:var(--f-body);font-size:20px;line-height:28px;padding:10px 12px;resize:none;outline:none;-webkit-user-select:text;user-select:text;
  -webkit-appearance:none}
textarea.cm:focus{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-35)}
textarea.cm::-webkit-input-placeholder{color:#8fa3b0;color:var(--sub);opacity:1}
textarea.cm::placeholder{color:#8fa3b0;color:var(--sub);opacity:1}

/* ナビ */
.nav{position:absolute;left:22px;top:702px;width:446px;height:76px}
.btn{position:absolute;top:0;height:76px;-webkit-transition:-webkit-transform .06s;transition:transform .06s}
.btn .in{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;font-family:var(--f-body);font-weight:900;font-size:22px}
.btn .hud{font-family:var(--f-hud);font-size:16px;letter-spacing:1px;margin-left:8px}
#back{left:0;width:160px;background:var(--cyan-60)}
#back .in{background:var(--surface);color:var(--cyan)}
#next{right:0;width:270px;background:var(--cyan)}
#next .in{background:#fff;color:#05080c}
#next.skip{background:var(--cyan-60)}
#next.skip .in{background:var(--surface);color:#fff}
#next.dis{background:rgba(143,163,176,.35)}
#next.dis .in{background:var(--surface);color:var(--sub)}
#next.go{background:var(--cyan)}
#next.go .in{background:#fff;color:#05080c;font-size:28px;letter-spacing:4px;
  background-image:repeating-linear-gradient(115deg,rgba(0,176,240,0) 0,rgba(0,176,240,0) 18px,rgba(0,176,240,.22) 18px,rgba(0,176,240,.22) 25px);
  background-size:200% 100%;-webkit-animation:stripes 1.2s linear infinite;animation:stripes 1.2s linear infinite}
#next.go.pressing .in{background:#dff4fc}
#next.fired{opacity:.3;-webkit-transform:scale(.94);transform:scale(.94)}
.btn.pressing,.btn:active{-webkit-transform:scale(.94);transform:scale(.94)}
.btn.pressing .in,.btn:active .in{-webkit-filter:brightness(1.4);filter:brightness(1.4)}
.btn.gone{visibility:hidden}
.shake{-webkit-animation:shake .32s;animation:shake .32s}
@-webkit-keyframes shake{25%{-webkit-transform:translateX(-8px)}75%{-webkit-transform:translateX(8px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- STOCK ---------- */
#stock{position:absolute;left:24px;top:1046px;width:492px;height:834px;background-color:#05080c;
  background-image:linear-gradient(to bottom,rgba(0,176,240,0),rgba(0,176,240,.14)),linear-gradient(to right,rgba(0,176,240,.08) 1px,rgba(0,176,240,0) 1px),linear-gradient(to bottom,rgba(0,176,240,.08) 1px,rgba(0,176,240,0) 1px);
  background-size:100% 100%,30px 30px,30px 30px}
#stock:before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:#fff}
.sh{position:absolute;left:14px;top:12px;width:462px;font-family:var(--f-hud);font-size:16px;letter-spacing:2px;color:var(--cyan)}
.sh span{position:absolute;right:0;top:-1px;font-family:var(--f-pixel);font-size:17px;letter-spacing:0;color:var(--sub)}
.sempty{position:absolute;left:0;top:360px;width:100%;text-align:center;font-family:var(--f-pixel);font-size:19px;line-height:32px;color:var(--sub);
  -webkit-transition:opacity .25s;transition:opacity .25s}

    X.writeFile(wb, 'デジクリアンケート_' + fileStamp() + '.xlsx');
    drawAdmin('Excel ファイルを書き出しました（' + load().length + ' 件）');
  } catch (e) { drawAdmin('書き出しに失敗しました: ' + e.message); }
}
function summary() {
  var all = load(), out = [['設問', '選択肢', '件数']], i, j, k;
  var count = function (field, v, isList) {
    var c = 0;
    for (k = 0; k < all.length; k++) {
      var x = all[k][field];
      if (isList ? (x || []).indexOf(v) >= 0 : x === v) c++;
    }
    return c;
  };
  for (j = 0; j < GENRES.length; j++) out.push(['良いと思った展示', GENRES[j][0] + ' ' + GENRES[j][1], count('q1codes', GENRES[j][0], true)]);
  for (j = 0; j < GENRES.length; j++) out.push(['特に良かった展示', GENRES[j][0] + ' ' + GENRES[j][1], count('best', GENRES[j][0] + ' ' + GENRES[j][1])]);
  var lists = { q2: '良かった理由', q4: '部員の対応' }, singles = { q3: '全体評価', q5: '年齢', q6: '属性' };
  for (i = 1; i < Q.length - 1; i++) {
    var q = Q[i];
    for (j = 0; j < q.opts.length; j++) {
      var v = q.opts[j].v, c = 0;
      if (lists[q.key]) { for (k = 0; k < all.length; k++) if (((all[k][q.key] || '').split(' / ')).indexOf(v) >= 0) c++; out.push([lists[q.key], v, c]); }
      else out.push([singles[q.key], v, count(q.key, v)]);
    }
  }
  // Q7 のタグはコメント欄に「…」の形で入っているので、そこから数える
  var q7 = Q[LAST];
  for (j = 0; j < q7.opts.length; j++) {
    var tag = '「' + q7.opts[j].v + '」', n7 = 0;
    for (k = 0; k < all.length; k++) if ((all[k].comment || '').indexOf(tag) >= 0) n7++;
    out.push(['ひとこと', q7.opts[j].v, n7]);
  }
  return out;
}
function csvText() {
  // = + - @ で始まる値は Excel で数式として動くので、先頭に ' を付けて文字列にする（CSV インジェクション対策）
  var esc = function (v) {
    var s = String(v === undefined || v === null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  var lines = [HEAD.map(esc).join(',')], r = rows();
  for (var i = 0; i < r.length; i++) lines.push(r[i].map(esc).join(','));
  return lines.join('\r\n');
}
function exportCsvFile() {
  try {
    var blob = new Blob(['﻿' + csvText()], { type: 'text/csv' });
    var a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url;
    a.download = 'デジクリアンケート_' + fileStamp() + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    return true;
  } catch (e) { return false; }
}
function adminAct(a, el) {
  if (a === 'ad-close') { $('admin').className = 'ov'; mode = 'survey'; lastActive = Date.now(); renderTotal(); renderNav(); return; }
  if (a === 'ad-xlsx') { exportXlsx(); return; }
  if (a === 'ad-csvfile') { drawAdmin(exportCsvFile() ? 'CSV ファイルを書き出しました' : 'CSV を保存できませんでした。「CSV を表示」からコピーしてください'); return; }
  if (a === 'ad-csv') { var b = $('csvBox'); b.value = csvText(); b.style.display = 'block'; return; }
  if (a === 'ad-rot') { setPref('rot', el.getAttribute('data-r')); layout(); drawAdmin(''); return; }
  if (a === 'ad-sound') { soundOn = !soundOn; setPref('sound', soundOn ? '1' : '0'); unlockAudio(); drawAdmin(''); return; }
  if (a === 'ad-fs') {
    var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
    if (f) { try { var p = f.call(d); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    return;
  }
  if (a === 'ad-clear') {
    clearTimeout(clearT);
    if (clearArmed && Date.now() - clearArmed < 5000) {
      // 連番は戻さない（消去前に書き出したファイルと ID が重ならないように）
      clearArmed = 0;
      drawAdmin(saveAll([]) ? '全データを消去しました' : '消去に失敗しました');
    } else {
      clearArmed = Date.now(); drawAdmin('');
      clearT = setTimeout(function () { if (clearArmed && mode === 'admin') { clearArmed = 0; drawAdmin(''); } }, 5000);
    }
  }
}

/* SheetJS: 同じフォルダの xlsx.full.min.js → なければ CDN（非同期で読むので起動は止めない） */
function loadXlsx() {
  function add(src, onerr) {
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = function () { xlsxState = window.XLSX ? 'ok' : 'fail'; };
    s.onerror = onerr;
    document.head.appendChild(s);
  }
  add(CFG.XLSX_LOCAL, function () { add(CFG.XLSX_CDN, function () { xlsxState = 'fail'; }); });
}

/* ================= 画面フィット（540x1920 を transform で拡大縮小・回転） ================= */
var layoutT;
function layout() {
  var ae = document.activeElement;
  if (ae && ae.tagName === 'TEXTAREA' && ae.id === 'cm') return; // ソフトキーボード表示中は動かさない
  var W = window.innerWidth, H = window.innerHeight, rot = pref('rot', '0');
  var rotated = rot === '90' || rot === '270';
  var aw = rotated ? H : W, ah = rotated ? W : H;
  var s = Math.min(aw / 540, ah / 1920), tr;
  if (rot === '90') tr = 'translate(' + ((W + 1920 * s) / 2) + 'px,' + ((H - 540 * s) / 2) + 'px) rotate(90deg) scale(' + s + ')';
  else if (rot === '270') tr = 'translate(' + ((W - 1920 * s) / 2) + 'px,' + ((H + 540 * s) / 2) + 'px) rotate(-90deg) scale(' + s + ')';
  else tr = 'translate(' + ((W - 540 * s) / 2) + 'px,' + ((H - 1920 * s) / 2) + 'px) scale(' + s + ')';
  app.style.webkitTransform = app.style.transform = tr;
  var k = Math.max(0.5, Math.min(2, s * (window.devicePixelRatio || 1)));
  if (Math.abs(k - CK) > 0.01) { CK = k; cv.width = Math.round(540 * k); cv.height = Math.round(1920 * k); }
}
window.addEventListener('resize', function () { clearTimeout(layoutT); layoutT = setTimeout(layout, 120); });
document.addEventListener('focusout', function () { setTimeout(layout, 300); });

/* ================= タッチ（10点マルチタッチ・長押し・誤タップ対策） ================= */
var presses = {}, lastTouchEv = 0;
function findAct(el) {
  while (el && el !== document && el.getAttribute) {
    if (el.getAttribute('data-act')) return el;
    el = el.parentNode;
  }
  return null;
}
function isText(el) { return el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT'); }
function pStart(id, target, x, y) {
  lastActive = Date.now();
  unlockAudio();
  var ae = document.activeElement;
  if (isText(ae) && ae !== target) ae.blur();
  var el = findAct(target);
  if (!el) return;
  var r = presses[id] = { el: el, x: x, y: y };
  el.classList.add('pressing');
  if (el.getAttribute('data-act') === 'opt' && Q[step].best && mode === 'survey') {
    r.lp = setTimeout(function () {
      if (presses[id] === r && !r.cancel) { r.used = true; el.classList.remove('pressing'); longPressOpt(el); }
    }, CFG.LONGPRESS_MS);
  }
}
function pMove(id, x, y) {
  var r = presses[id];
  if (!r || r.cancel) return;
  if (Math.abs(x - r.x) > 24 || Math.abs(y - r.y) > 24) { r.cancel = true; clearTimeout(r.lp); r.el.classList.remove('pressing'); }
}
function pEnd(id, x, y) {
  var r = presses[id];
  delete presses[id];
  if (!r) return;
  clearTimeout(r.lp);
  r.el.classList.remove('pressing');
  if (r.cancel || r.used) return;
  if (findAct(document.elementFromPoint(x, y)) === r.el) dispatch(r.el);
}
document.addEventListener('touchstart', function (e) {
  lastTouchEv = Date.now();
  for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; pStart(t.identifier, t.target, t.clientX, t.clientY); }
  if (!isText(e.target)) e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', function (e) {
  for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; pMove(t.identifier, t.clientX, t.clientY); }
  if (!isText(e.target)) e.preventDefault();
}, { passive: false });
document.addEventListener('touchend', function (e) {
  lastTouchEv = Date.now();
  for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; pEnd(t.identifier, t.clientX, t.clientY); }
  if (!isText(e.target)) e.preventDefault();
}, { passive: false });
document.addEventListener('touchcancel', function (e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    var r = presses[e.changedTouches[i].identifier];
    if (r) { clearTimeout(r.lp); r.el.classList.remove('pressing'); }
    delete presses[e.changedTouches[i].identifier];
  }
});
// PC 確認用（タッチ直後の疑似マウスイベントは無視）
document.addEventListener('mousedown', function (e) { if (Date.now() - lastTouchEv > 800) pStart('m', e.target, e.clientX, e.clientY); });
document.addEventListener('mousemove', function (e) { if (presses.m) pMove('m', e.clientX, e.clientY); });
document.addEventListener('mouseup', function (e) { if (Date.now() - lastTouchEv > 800) pEnd('m', e.clientX, e.clientY); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

function dispatch(el) {
  var a = el.getAttribute('data-act');
  if (a === 'logo') { logoTap(); return; }
  if (a === 'pk') { pinKey(el.getAttribute('data-k')); return; }
  if (a.indexOf('ad-') === 0) { adminAct(a, el); return; }
  if (a === 'keep') { mode = 'survey'; $('warn').className = 'ov'; lastActive = Date.now(); return; }
  if (mode !== 'survey') return;
  if (a === 'opt') tapOpt(el);
  else if (a === 'next') { if (step === LAST) submit(); else go(1); }
  else if (a === 'back') go(-1);
  else if (a === 'chip') jump(parseInt(el.getAttribute('data-step'), 10));
}

/* ================= 起動 ================= */
layout();
renderTotal();
updateStock();
render();
loadXlsx();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); });

})();
</script>
